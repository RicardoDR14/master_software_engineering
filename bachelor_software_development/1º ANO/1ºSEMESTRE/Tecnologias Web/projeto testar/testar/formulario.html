<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <form>
        <h1>Formulário de Teste</h1>

        <label for="campo_nome"> Nome: </label>
        <input id="campo_nome" type="text" placeholder="Escreve o teu nome" required>

        <br><br>

        <label for="campo_passe"> Palavra-Passe: </label>
        <input id="campo_passe" type="password" placeholder="Escreva uma senha" required>

        <br><br>

        <label for="campo_email"> Email: </label>
        <input id="campo_email" type="email" placeholder="Escreva um email" required>

        <br><br><hr>

        <h2>Qual a tua ocupação nos tempos livres?</h2>

        <input name="ocupação" type="radio" value="Estudar" id="estudar">
        <label for="estudar">Estudar</label>

        <input name="ocupação" type="radio" value="ouvirmúsica" id="música">
        <label for="música">Ouvir música</label>

        <input name="ocupação" type="radio" value="sport" id="desporto">
        <label for="desporto">Fazer desporto</label>
        <br><br>

        <input type="submit" value="Enviar Formulário" required>

        <br><br>

    
    
    
    </form>
    <a href="vscodetestar.html">Voltar ao site principal
    </a>
</body>
</html>
